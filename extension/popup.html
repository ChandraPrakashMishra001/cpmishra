<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="avatar">🌿</div>
        <div class="header-info">
          <div class="app-name" id="header-name">Amanai</div>
          <div class="status-row">
            <span class="status-dot" id="status-dot"></span>
            <span class="status-label" id="status-label">Ready</span>
          </div>
        </div>
      </div>
      <div class="model-badge" id="model-badge">Flash</div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="voice">🎤 Voice</button>
      <button class="tab" data-tab="skills">🎯 Skills</button>
      <button class="tab" data-tab="settings">⚙️ Settings</button>
    </nav>

    <!-- Voice Tab -->
    <div class="tab-content active" id="voice-tab">
      <div class="conversation" id="conversation">
        <div class="welcome-msg">
          <p class="welcome-title">Voice Navigator</p>
          <p>Tap the mic and speak, or type below.</p>
          <p class="hint">Try: "search for rice varieties" · "open youtube" · "read this page"</p>
        </div>
      </div>
      <div class="input-bar">
        <input type="text" id="text-input" placeholder="Type a message or command..." autocomplete="off">
        <button id="send-btn" class="send-btn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="voice-controls">
        <div class="mic-wrapper">
          <button id="mic-btn" class="mic-btn" title="Click to speak">
            <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="30" height="30">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
          </button>
          <div class="mic-label" id="mic-label">Tap to speak</div>
        </div>
        <div class="quick-actions">
          <button class="qa-btn" id="read-page-btn" title="Read current page">📖</button>
          <button class="qa-btn" id="clear-btn" title="Clear conversation">🗑️</button>
          <button class="qa-btn" id="stop-voice-btn" title="Stop voice output">🔇</button>
        </div>
      </div>
    </div>

    <!-- Skills Tab -->
    <div class="tab-content" id="skills-tab">
      <div class="skills-header">
        <h2>Custom Training</h2>
        <button class="add-btn" id="add-skill-btn">+ New Skill</button>
      </div>
      <p class="tab-hint">Active skills shape how Amanai responds. Toggle them on/off for different tasks.</p>
      <div class="skills-list" id="skills-list"></div>
      <div class="skill-editor hidden" id="skill-editor">
        <input type="text" id="skill-name-input" placeholder="Skill name (e.g. Code Reviewer)" class="skill-name-input">
        <textarea id="skill-instructions-input" placeholder="Instructions for Amanai when this skill is active. Be specific about role, tone, format, and constraints." class="skill-instructions-input"></textarea>
        <div class="skill-editor-actions">
          <button class="btn-primary" id="save-skill-btn">Save Skill</button>
          <button class="btn-secondary" id="cancel-skill-btn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Settings Tab -->
    <div class="tab-content" id="settings-tab">
      <div class="settings-group">
        <label class="setting-label">AI Model</label>
        <select id="model-select" class="setting-select">
          <option value="google/gemini-3.5-flash">Gemini 3.5 Flash — Fast</option>
          <option value="google/gemini-3.1-pro-preview">Gemini 3.1 Pro — Deep Reasoning</option>
        </select>
      </div>
      <div class="settings-group toggle-group">
        <label class="setting-label">Voice Responses</label>
        <label class="toggle">
          <input type="checkbox" id="voice-enabled" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="settings-group">
        <label class="setting-label">Voice Speed: <span id="rate-value">1.0</span>×</label>
        <input type="range" id="voice-rate" min="0.5" max="2" step="0.1" value="1.0" class="setting-range">
      </div>
      <div class="settings-group">
        <label class="setting-label">Companion Name</label>
        <input type="text" id="companion-name" value="Amanai" class="setting-input" maxlength="30">
      </div>
      <div class="settings-group toggle-group">
        <label class="setting-label">Auto-navigate from speech</label>
        <label class="toggle">
          <input type="checkbox" id="auto-navigate" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="settings-group toggle-group">
        <label class="setting-label">Auto-send after speech</label>
        <label class="toggle">
          <input type="checkbox" id="auto-send" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
